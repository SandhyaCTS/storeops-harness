name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Same command the harness Evaluator runs: Checkstyle, all tests incl. ArchitectureRulesTest, SpotBugs.
      - run: mvn -B verify
